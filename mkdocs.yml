site_name: Liu Zewen -- Research and Projects
site_url: https://aidless.github.io/aidless/
repo_url: https://github.com/aidless/aidless
repo_name: aidless/aidless
site_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

nav:
  - Chinese (中文):
    - zh/index.md
    - Research:
      - zh/research/overview.md
      - zh/research/papers.md
      - zh/research/projects.md
    - Blog:
      - zh/blog/loop-engineering.md
      - zh/blog/memory-contagion.md
  - English:
    - en/index.md
    - Research:
      - en/research/overview.md
      - en/research/papers.md
      - en/research/projects.md
    - Blog:
      - en/blog/loop-engineering.md
      - en/blog/memory-contagion.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true
